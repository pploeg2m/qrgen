<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exam template designer · qrgen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --line:#d9dce1; --ink:#1c2430; --dim:#667085; --acc:#0b6bcb; --warn:#b42318; --stamp:#0b6bcb; --sel:#e8590c; --selbg:#fff4ec; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header .sp { flex: 1; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: #98a2b3; }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: #fff; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: #fff; }
  main { flex: 1; min-height: 0; display: flex; }
  aside { width: 372px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .tabs { display: flex; border-bottom: 1px solid var(--line); }
  aside .tabs button { flex: 1; border: 0; border-radius: 0; padding: 9px; background: #fafafa; color: var(--dim); font-weight: 600; }
  aside .tabs button.on { background: #fff; color: var(--ink); box-shadow: inset 0 -2px 0 var(--acc); }
  .panel { overflow: auto; padding: 4px 12px 30px; flex: 1; }
  details { border-bottom: 1px solid var(--line); padding: 6px 0; }
  summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  summary .tag { font-weight: 500; font-size: 11px; color: #fff; background: var(--acc); border-radius: 9px; padding: 1px 7px; margin-left: 6px; }
  .row { display: grid; grid-template-columns: 1fr 132px; gap: 8px; align-items: center; margin: 5px 0; }
  .row.wide { grid-template-columns: 1fr; gap: 3px; }
  .row label { color: #344054; }
  .row .help { grid-column: 1 / -1; color: var(--dim); font-size: 11.5px; margin-top: -3px; }
  .row code { font-size: 11.5px; color: var(--acc); }
  .field { display: flex; align-items: center; gap: 5px; }
  .field .u { color: var(--dim); font-size: 11.5px; width: 22px; }
  input[type=number], input[type=text], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: #fff; min-width: 0; }
  input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 5px; }
  textarea { resize: vertical; min-height: 54px; font-family: inherit; }
  input:disabled { background: #f2f4f7; color: #98a2b3; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #info { padding: 7px 14px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); background: #fbfbfc; }
  #info b { color: var(--ink); font-weight: 600; }
  #info .w { color: var(--warn); display: block; }
  #scroll { flex: 1; overflow: auto; padding: 18px; text-align: center; }
  #paper { display: inline-block; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.12); line-height: 0; }
  #paper svg { display: block; }
  #cmd { border-top: 1px solid var(--line); background: #101828; color: #e4e7ec; padding: 9px 14px; }
  #cmd .top { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; font-size: 12px; color: #98a2b3; }
  #cmd .top .sp { flex: 1; }
  #cmd button { background: #1d2939; border-color: #344054; color: #e4e7ec; padding: 3px 9px; }
  #cmd pre { margin: 0; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow: auto; user-select: all; }
  #cmd .err { color: #fda29b; font-size: 12px; margin-top: 4px; }
  #cmd .sum { color: #a6f4c5; font-size: 12px; margin-top: 4px; }
  #paper rect.hit { fill: transparent; stroke: none; cursor: pointer; }
  #paper rect.hit:hover { stroke: var(--acc); stroke-width: 0.35; stroke-dasharray: 1.4 1; }
  #paper rect.hit.on { stroke: var(--sel); stroke-width: 0.6; stroke-dasharray: none; fill: rgba(232, 89, 12, 0.07); }
  details.sel { background: var(--selbg); box-shadow: inset 3px 0 0 var(--sel); margin: 0 -12px; padding: 6px 12px; }
  details.sel > summary { color: var(--sel); }
  .row.sel { background: var(--selbg); box-shadow: inset 3px 0 0 var(--sel); margin: 5px -12px; padding: 3px 12px; }
  #selNote { color: var(--sel); font-weight: 600; }
  #selNote button { padding: 0 6px; margin-left: 4px; font-weight: 400; color: var(--ink); }
  label.chk { display: inline-flex; gap: 6px; align-items: center; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Exam template designer</h1>
  <label>Preset
    <select id="variant">
      <option value="classic">front / back (plain)</option>
      <option value="F">frontF / backF (task bar + reserved box)</option>
      <option value="Fv2">frontFv2 / backFv2 (task bar)</option>
    </select>
  </label>
  <div class="seg" id="pageSeg"><button data-page="front">Front</button><button data-page="back">Back</button></div>
  <div class="seg" id="zoomSeg"><button data-zoom="fit">Fit</button><button data-zoom="1">100 %</button><button data-zoom="2">200 %</button></div>
  <label class="chk"><input type="checkbox" id="stamps"> show what the script stamps</label>
  <span class="sp"></span>
  <button id="saveCfg" title="Save all settings as JSON">Save settings</button>
  <button id="loadCfg" title="Load settings from JSON">Load settings</button>
  <input type="file" id="cfgFile" accept="application/json,.json" hidden>
  <button class="pri" id="dlFront"></button>
  <button class="pri" id="dlBack"></button>
</header>
<main>
  <aside>
    <div class="tabs"><button data-tab="layout">Page layout</button><button data-tab="flags">Script flags</button></div>
    <div class="panel" id="layoutPanel"></div>
    <div class="panel" id="flagsPanel" hidden></div>
  </aside>
  <section id="stage">
    <div id="info"></div>
    <div id="scroll"><div id="paper"></div></div>
    <div id="cmd">
      <div class="top"><span>Command (run in the qrgen folder)</span><span class="sp"></span>
        <label class="chk"><input type="checkbox" id="allFlags"> spell out defaults</label>
        <button id="copyCmd">Copy</button></div>
      <pre id="cmdText"></pre>
      <div class="err" id="cmdErr"></div>
      <div class="sum" id="cmdSum"></div>
    </div>
  </section>
</main>

  const type = el.dataset.type;
  let v = type === 'bool' ? el.checked : el.value;
  if (type === 'num' || type === 'int') {
    if (path.startsWith('cli.')) v = el.value.trim();          // an empty flag field means "not given"
    else { v = parseFloat(el.value); if (!Number.isFinite(v)) return; }
  }
  setP(S, path, v);
  if (path === 'cli.templates') S.cli.templatesAuto = false;
  const rebuild = path === 'g.square' || path === 'cli.templatesAuto' || (path === 'cli.templates');
  if (path === 'cli.templates') { const a = document.querySelector('[data-path="cli.templatesAuto"]'); if (a) a.checked = false; refresh(false); return; }
  refresh(rebuild && type === 'bool');
}
function download(side) {
  const blob = new Blob([pdfFor(side)], { type: 'application/pdf' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = S[side].file || side + '.pdf';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function loadLogo(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const url = String(rd.result);
    let info = null; try { info = jpegInfo(b64bytes(url)); } catch (e) { info = null; }
    if (file.type === 'image/jpeg' && info && info.nc !== 4) { S.logo = url; refresh(false); return; }
    const img = new Image();
    img.onload = () => {
      const scale = Math.max(1, Math.min(4, 1600 / (img.naturalWidth || 400)));
      const cv = document.createElement('canvas');
      cv.width = Math.round((img.naturalWidth || 400) * scale); cv.height = Math.round((img.naturalHeight || 300) * scale);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      S.logo = cv.toDataURL('image/jpeg', 0.95); refresh(false);
    };
    img.onerror = () => alert('This file could not be read as an image.');
    img.src = url;
  };
  rd.readAsDataURL(file);
}

try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = deepMerge(defaults('Fv2'), JSON.parse(raw)); } catch (e) { S = defaults('Fv2'); }

document.addEventListener('input', onInput);
document.addEventListener('click', e => {
  const hit = e.target.closest('#paper [data-el]');
  if (hit) { select(hit.dataset.el === S.ui.sel ? '' : hit.dataset.el); return; }
  if (e.target.closest('#paper') || e.target.id === 'scroll') { select(''); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'selClear') { select(''); return; }
  if (b.dataset.page) { S.ui.page = b.dataset.page; refresh(true); }
  else if (b.dataset.zoom) { S.ui.zoom = b.dataset.zoom; refresh(false); }
  else if (b.dataset.tab) { S.ui.tab = b.dataset.tab; refresh(false); }
  else if (b.dataset.act === 'fitQR') { fitQR(); refresh(true); }
  else if (b.id === 'logoPick') $('logoFile').click();
  else if (b.id === 'logoReset') { S.logo = null; refresh(false); }
  else if (b.id === 'dlFront') download('front');
  else if (b.id === 'dlBack') download('back');
  else if (b.id === 'copyCmd') { navigator.clipboard.writeText($('cmdText').textContent).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1200); }); }
  else if (b.id === 'saveCfg') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'template_designer_settings.json';
    document.body.appendChild(a); a.click(); a.remove();
  } else if (b.id === 'loadCfg') $('cfgFile').click();
});
document.addEventListener('change', e => {
  if (e.target.id === 'logoFile' && e.target.files[0]) loadLogo(e.target.files[0]);
  if (e.target.id === 'cfgFile' && e.target.files[0]) {
    e.target.files[0].text().then(t => { S = deepMerge(defaults('Fv2'), JSON.parse(t)); refresh(true); }).catch(() => alert('Not a settings file.'));
    e.target.value = '';
  }
});
$('variant').addEventListener('change', e => {
  // a preset replaces the page layout only; grid, logo and script flags stay
  const v = e.target.value; S.variant = v; Object.assign(S, presetPages(v)); refresh(true);
});
$('stamps').addEventListener('change', e => { S.ui.stamps = e.target.checked; refresh(false); });
$('allFlags').addEventListener('change', e => { S.ui.allFlags = e.target.checked; refresh(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ui.sel) select(''); });
window.addEventListener('resize', () => { if (S.ui.zoom === 'fit') renderPreview(); });
refresh(true);
}
</script>
